version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The ref is the Rust toolchain to install, not the action's version.
      # The MSRV job pins it to `rust-version` from Cargo.toml on purpose.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
