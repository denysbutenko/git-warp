[package]
name = "git-warp"
version = "0.3.0"
edition = "2024"
authors = ["Git-Warp Contributors"]
description = "High-performance, UX-focused Git worktree manager combining CoW speed with advanced features"
license = "MIT"
repository = "https://github.com/denysbutenko/git-warp"
readme = "README.md"

[lib]
name = "git_warp"
path = "src/lib.rs"

[[bin]]
name = "warp"
path = "src/main.rs"

[[test]]
name = "mod"
path = "tests/mod.rs"

[[bench]]
name = "performance_benchmarks"
path = "benches/performance_benchmarks.rs"
harness = false

[dependencies]
# CLI & TUI
clap = { version = "4.5.4", features = ["derive", "env"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

# Core Logic
nix = { version = "0.31.3", features = ["fs", "signal", "ioctl"] }
rayon = "1.10.0"
ignore = "0.4.22"
sysinfo = "0.39.3"

# Configuration & Data
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
toml = "0.9.6"

# Utilities
anyhow = "1.0.86"
thiserror = "2.0.18"
log = "0.4.21"
env_logger = "0.11.3"
dirs = "6.0.0"
chrono = "0.4.38"
tempfile = "3.10.1"

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
